name: DevSift Runtime Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt'
      - name: Explicit pinned validation schema setup
        run: python tools/setup_validation.py
      - name: Check documentation and offline consumer guides
        run: python tools/check_docs.py
      - name: Runtime and official schema validation tests
        env:
          DEVSIFT_TEST_SCHEMA: '1'
        run: python -m unittest discover -s tests -v
