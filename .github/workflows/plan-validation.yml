name: DevSift Plan Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-plan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dependency graph
        run: python tools/planctl.py validate
      - name: Verify project scaffold
        run: python tools/validate_kit.py
      - name: Test graph behavior
        run: python -m unittest discover -s tests -v
