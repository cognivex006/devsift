name: DevSift Installed CLI Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision the explicitly pinned build backend
        run: python -m pip install --disable-pip-version-check setuptools==83.0.0
      - name: Install the actual console package offline
        run: python -m pip install --disable-pip-version-check --no-index --no-deps --no-build-isolation .
      - name: Verify installed CLI output and read-only behavior
        env:
          DEVSIFT_TEST_INSTALLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p test_cli_platform.py -v
      - name: Verify installed consumer governance and shadow isolation
        env:
          DEVSIFT_TEST_INSTALLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -p test_governance_boundary.py -v
      - name: Verify actual offline artifacts, fresh installs and explicit rollback
        env:
          DEVSIFT_TEST_PACKAGE_INSTALL: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PIP_NO_INDEX: '1'
        run: python -B -m unittest discover -s tests -p test_package_install.py -v
      - name: Verify downloaded installer in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p test_windows_bootstrap.py -v
