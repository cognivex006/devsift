name: DevSift Installed CLI Contract
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  installed-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the actual console package
        run: python -m pip install --disable-pip-version-check .
      - name: Verify installed CLI output and read-only behavior
        env:
          DEVSIFT_TEST_INSTALLED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p test_cli_platform.py -v
