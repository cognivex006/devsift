name: Installer assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tools/install*.py'
      - 'tools/build_installer.py'
      - 'tests/test_*bootstrap.py'
      - 'tests/*support.py'
      - 'tests/test_install_progress.py'
      - 'tools/bootstrap_progress.cs'
      - '.github/workflows/installer-assets.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --progress-bar on setuptools==83.0.0 wheel
      - run: python -m pip install --progress-bar on pyte==0.8.2
      - if: runner.os == 'Windows'
        run: python -m pip install --progress-bar on pywinpty==3.1.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.205'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build self-contained analyzers for the actual installation test
        run: python tools/build_analyzer_bundle.py --output .devsift/local/analyzer-assets
      - name: Embed the verified companion for offline bootstrap verification
        shell: python
        run: |
          import hashlib
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from tools.build_installer import build
          companion, = Path('.devsift/local/analyzer-assets').glob('*.zip')
          pin = companion.with_suffix('.zip.sha256').read_text().split()[0]
          assert hashlib.sha256(companion.read_bytes()).hexdigest() == pin
          build(Path.cwd(), Path('dist/installer'), analyzer_bundle=companion.resolve(), analyzer_bundle_digest=pin)
      - name: Verify actual bundle and live bootstrap feedback
        env:
          DEVSIFT_TEST_INSTALLER_BUNDLE: ${{ github.workspace }}/dist/installer/devsift-install.zip
          DEVSIFT_TEST_TERMINAL_ARTIFACTS: ${{ github.workspace }}/dist/terminal-evidence
          TERM: xterm-256color
        run: python -B -m unittest discover -s tests -p 'test_*bootstrap.py' -v
      - name: Direct installer renderer screen tests
        env:
          DEVSIFT_TEST_TERMINAL_ARTIFACTS: ${{ github.workspace }}/dist/terminal-evidence
          TERM: xterm-256color
        run: python -B -m unittest discover -s tests -p test_install_progress.py -v
      - name: Fresh installation must lint without manifest flags or SDK PATH
        env:
          DEVSIFT_TEST_INSTALLER_BUNDLE: ${{ github.workspace }}/dist/installer/devsift-install.zip
          DEVSIFT_TEST_READY_RECEIPT: ${{ github.workspace }}/dist/ready-installation-receipt.json
        run: python -B -m unittest discover -s tests -p test_ready_installation.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devsift-installer-assets-${{ runner.os }}
          path: dist/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: devsift-terminal-evidence-${{ runner.os }}
          path: dist/terminal-evidence/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: devsift-ready-installation-${{ runner.os }}
          path: dist/ready-installation-receipt.json
