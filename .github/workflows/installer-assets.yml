name: Installer assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tools/install*.py'
      - 'tools/build_installer.py'
      - 'tests/test_*bootstrap.py'
      - 'tests/*support.py'
      - 'tests/test_install_progress.py'
      - 'tools/bootstrap_progress.cs'
      - '.github/workflows/installer-assets.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --progress-bar on setuptools==83.0.0 wheel
      - run: python -m pip install --progress-bar on pyte==0.8.2
      - if: runner.os == 'Windows'
        run: python -m pip install --progress-bar on pywinpty==3.1.0
      - run: python tools/build_installer.py --output dist/installer
      - name: Verify actual bundle and live bootstrap feedback
        env:
          DEVSIFT_TEST_INSTALLER_BUNDLE: ${{ github.workspace }}/dist/installer/devsift-install.zip
          DEVSIFT_TEST_TERMINAL_ARTIFACTS: ${{ github.workspace }}/dist/terminal-evidence
          TERM: xterm-256color
        run: python -B -m unittest discover -s tests -p 'test_*bootstrap.py' -v
      - name: Direct installer renderer screen tests
        env:
          DEVSIFT_TEST_TERMINAL_ARTIFACTS: ${{ github.workspace }}/dist/terminal-evidence
          TERM: xterm-256color
        run: python -B -m unittest discover -s tests -p test_install_progress.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devsift-installer-assets-${{ runner.os }}
          path: dist/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: devsift-terminal-evidence-${{ runner.os }}
          path: dist/terminal-evidence/*
