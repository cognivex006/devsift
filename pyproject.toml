[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "devsift"
version = "0.0.0.dev0"
description = "Read-only quality analysis CLI with explicitly trusted native analyzers"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
devsift = "devsift.cli:main"

[tool.setuptools.packages.find]
include = ["devsift*"]
